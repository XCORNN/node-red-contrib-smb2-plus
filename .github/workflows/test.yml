name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 18, nodered: 2 }
          - { node: 18, nodered: 3 }
          - { node: 20, nodered: 4 }
          - { node: 22, nodered: 5 }
    name: Node ${{ matrix.node }} / Node-RED ${{ matrix.nodered }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Start Samba test server
        run: sudo -E bash test/setup-samba.sh
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund node-red@${{ matrix.nodered }}
      - name: Run tests
        run: npm test
      - name: Samba logs (on failure)
        if: failure()
        run: sudo tail -n 80 /var/log/samba/*.log || true

  package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"
