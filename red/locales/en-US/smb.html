<script type="text/html" data-help-name="SMB">
    <p>Reads and writes files on Windows / Samba shared folders (SMB2).</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">filename <span class="property-type">string</span></dt>
        <dd>Path used when the node's <i>Path</i> is empty. Relative to the share, e.g.
            <code>folder\file.txt</code>. <code>/</code> is accepted as well. The full UNC path of the
            configured share is also accepted and stripped automatically.</dd>
        <dt class="optional">new_filename <span class="property-type">string</span></dt>
        <dd>Destination for <i>Rename / Move</i> when <i>New path</i> is empty.</dd>
        <dt class="optional">payload <span class="property-type">string | Buffer | object</span></dt>
        <dd>Content for <i>Write file</i>. Objects are written as JSON.</dd>
        <dt class="optional">operation <span class="property-type">string</span></dt>
        <dd>Only when the operation is <i>set by msg.operation</i>: one of <code>read-dir</code>,
            <code>read-file</code>, <code>create</code>, <code>rename</code>, <code>unlink</code>,
            <code>mkdir</code>, <code>ensure-dir</code>, <code>rmdir</code>, <code>exists</code>, <code>info</code>.</dd>
        <dt class="optional">encoding <span class="property-type">string</span></dt>
        <dd>Overrides the node's output format (read) or text encoding (write).</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload</dt>
        <dd><i>Read directory</i>: array of names, or of objects
            <code>{name, path, isDirectory, size, mtime, ...}</code> with <i>Include details</i>.<br>
            <i>Read file</i>: text or Buffer.<br>
            <i>Info</i>: <code>{name, path, isDirectory, size, birthtime, mtime, atime, ctime}</code>.</dd>
        <dt>exists <span class="property-type">boolean</span></dt>
        <dd><i>Exists</i> operation result.</dd>
    </dl>

    <h3>Details</h3>
    <p>Operations sharing a connection are queued and run one at a time. Every operation has a
       timeout. After a connection problem (session expired, socket closed, timeout) a new session is
       opened and the operation is retried, <b>only when it is safe</b>: reads, listings, overwrites
       and <i>ensure directory</i> are always retried; append, create, rename and delete are retried
       only if the request never reached the server. Login errors are never retried, to avoid locking
       the account.</p>
    <p>On error no message is sent: use a <b>catch</b> node. <code>msg.smbError.code</code> holds the
       error code (also <code>msg.error.code</code> on Node-RED 4+), e.g.
       <code>STATUS_OBJECT_NAME_NOT_FOUND</code>, <code>STATUS_ACCESS_DENIED</code>,
       <code>STATUS_LOGON_FAILURE</code>, <code>STATUS_OBJECT_NAME_COLLISION</code> (already exists),
       <code>SMB_TIMEOUT</code>, <code>SMB_FILE_TOO_LARGE</code>.</p>
    <p><i>Append</i> reads the existing file and rewrites it with the new content at the end: fine for
       logs and CSV files, not for huge files.</p>
</script>

<script type="text/html" data-help-name="smb config">
    <p>Connection to an SMB share.</p>
    <dl class="message-properties">
        <dt>Share</dt>
        <dd><code>\\server\share</code>. A sub-folder may be added (<code>\\server\share\sub\folder</code>):
            every path is then relative to it. Prefer the full DNS name
            (<code>server.domain.local</code>) or the IP when Node-RED runs in Docker/Linux.</dd>
        <dt>Domain</dt>
        <dd>Domain name (e.g. <code>COMPANY</code> or <code>company.local</code>). Empty for local accounts.
            <code>DOMAIN\user</code> or <code>user@domain</code> in the username field also works.</dd>
        <dt>Username / Password</dt>
        <dd>Stored encrypted in the Node-RED credentials file, not in the flow.</dd>
    </dl>
</script>
